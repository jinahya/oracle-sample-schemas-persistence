# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main", "sketch" ]
  pull_request:
    branches: [ "develop", "main", "sketch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      # submodules are deliberately NOT fetched: db-sample-schemas carries the install
      # scripts for a live database and nothing in the Maven build reads it.
    # The build JDK, not the target. Main sources are compiled with --release 21 (see
    # maven.compiler.release) so the artifacts stay usable on 21; the TEST sources are
    # compiled with --release 25 (maven.compiler.testRelease), which a JDK 21 javac cannot
    # do -- it fails with "release version 25 not supported". Keep this in step with
    # the enforcer's requireJavaVersion bound in the root pom.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # `verify`, not `package`: it runs everything bound up to and including verify -- the unit
    # tests against the __testPU persistence unit (H2, in-memory, schema generated from the
    # mappings), jacoco and the licence check -- so a green run here means the __testPU path is
    # verified end to end.
    #
    # The __itPU integration tests are NOT run, and cannot be: maven-failsafe-plugin is declared
    # only inside the `failsafe` profile, so `verify` without -Pfailsafe never reaches an *_IT
    # class. Those need the Oracle database from docker-compose.yml, with the sample schemas
    # installed; see the `integration` job note below.
    - name: Verify with Maven
      run: mvn -B verify --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v4

  # Every supported Jakarta EE 11 combination, which CLAUDE.md asks for by name: "Check convergence
  # across all six supported combinations, not just the defaults". The job above runs exactly one of
  # the six -- whatever is activeByDefault -- so hibernate-orm-7.2 and hibernate-validator-9.0 were
  # never exercised anywhere but on a developer's machine, via _mvn_jakarta_ee_11.sh. This is that
  # script, as a matrix.
  #
  # Naming any profile on the command line deactivates every activeByDefault profile, so a profile
  # from EACH axis has to be named: provider, validator, and CDI. A lone provider -P would leave the
  # build with no validator at all. That is why ___weld-6 is repeated in every cell rather than left
  # to the default, and why the validator is named even when it is the default one.
  #
  # No `clean` here, unlike _mvn_jakarta_ee_11.sh: that clean exists because the local script runs
  # the combinations one after another in the same working copy, and the metamodel the annotation
  # processor writes differs per provider. Each cell below is a fresh checkout, so there is nothing
  # to clean.
  #
  # `test`, not `verify`: what each cell is here to answer is whether the combination compiles, its
  # dependencies converge and the __testPU tests pass -- and all three are settled by the end of the
  # test phase. The convergence enforcer is bound to `validate`, so it runs in every cell regardless,
  # and the packaging, jacoco and licence steps between test and verify do not vary by provider, so
  # paying for them six times buys nothing. The `build` job above runs the full `verify` once.
  #
  # Either way no *_IT class is reachable here: maven-failsafe-plugin is declared only inside the
  # `failsafe` profile, which none of these cells name.
  combinations:

    runs-on: ubuntu-latest

    strategy:
      # one broken combination should not hide the state of the other five
      fail-fast: false
      matrix:
        provider:
          - __hibernate-orm-7.4-jakarta-ee-11
          - __hibernate-orm-7.2-jakarta-ee-11
          - __eclipselink-5.0-jakarta-ee-11
        validator:
          - ___hibernate-validator-9.1-jakarta-ee-11
          - ___hibernate-validator-9.0-jakarta-ee-11

    name: ${{ matrix.provider }} / ${{ matrix.validator }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Test
      run: >
        mvn -B test
        -P${{ matrix.provider }},${{ matrix.validator }},___weld-6-jakarta-ee-11
