services:
  oracle-sample-schemas:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: oracle-sample-schemas
    privileged: true
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: Passw0rd!
    volumes:
      - ./db-sample-schemas:/db-sample-schemas
      # not bound: the database lives in the container, which `down` removes, so every run installs the schemas afresh
#      - ./opt/oracle/oradata:/opt/oracle/oradata
      # runs on every container start; installs CO/HR/SH unless already there (see the script)
      - ./opt/oracle/scripts/startup:/opt/oracle/scripts/startup
#      - /etc/localtime:/etc/localtime:ro
#      - /etc/timezone:/etc/timezone:ro
