# Registry of the exercises of every module, in EXERCISES.adoc and src/test/sql/*_EXERCISES.sql.
#
# An id is <MODULE>-<SECTION>-<TIER>-<NN>: the module (CO, HR, SH), the table or view the exercise reads alone, or
# SCHEMA for one that reads more than one, the tier (B for Basic, I for Intermediate, A for Advanced), and a number
# within that section and tier.
#
# Ids are permanent. A new exercise takes the next unused number of its section and tier; an exercise that moves or
# changes tier keeps its id; an id of a removed exercise is marked `retired: true` and never reused. EXERCISES.adoc
# carries each id as the anchor and the prefix of the exercise's heading, and the *_EXERCISES.sql files repeat it in
# the marker above the statement.
#
# `named-queries` lists the entity's @NamedQuery that answers the exercise, by its name; the nested test class of that
# query, in the entity's *_Persistence_Test and *_Persistence_IT, names the exercise id in its javadoc.


